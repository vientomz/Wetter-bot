name: Wetter Nachricht

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  wetter:
    runs-on: ubuntu-latest
    steps:
      - name: Wetter abrufen und per ntfy schicken
        run: |
          WETTER=$(curl -s "wttr.in/Duesseldorf?format=%C,+%t+(gef%C3%BChlt+%f),+Regen-Chance:+%p")
          curl -H "Title: Guten Morgen! ☀️" \
               -d "Wetter heute in Düsseldorf: $WETTER" \
               ntfy.sh/lasse-wetter-8271
