name: Wetter Nachricht

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  wetter:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Wetter abrufen und speichern
        run: |
          echo "Wetter am $(date '+%d.%m.%Y %H:%M'): $(curl -s wttr.in/Duesseldorf?format=%C+%t)" >> wetter.txt

      - name: Änderung zurück committen
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatisches Wetter-Update"
